services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MinhaS3nha123"
      MSSQL_PID: Developer
      MSSQL_TCP_PORT: 1433
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql   # montado na raiz — SQL Server gerencia as subpastas
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -No -Q 'SELECT 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-init
    depends_on:
      sqlserver:
        condition: service_healthy # Só roda quando o banco principal estiver pronto
    volumes:
      - ./infra/sql/init.sql:/usr/config/init.sql # Mapeia seu script
    user: root
    networks:
      - backend
    entrypoint: >
      /bin/bash -c "
      echo 'Aguardando 10 segundos para estabilização final...';
      sleep 10;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'MinhaS3nha123' -No -i /usr/config/init.sql;
      echo 'Script de criação executado com sucesso!';"

volumes:
  sqlserver-data:
    driver: local

networks:
  backend:
    driver: bridge