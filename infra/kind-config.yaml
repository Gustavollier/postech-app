# kind-config.yaml
# Fix para Docker Desktop 4.x no Windows com WSL2 backend + cgroup v2
# Resolve: "could not find a log line that matches Reached target Multi-User System"
# + "Starting control-plane" travado (SystemdCgroup = true necessário com cgroup v2)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".containerd]
    snapshotter = "native"
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
    runtime_type = "io.containerd.runc.v2"
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
    SystemdCgroup = true
