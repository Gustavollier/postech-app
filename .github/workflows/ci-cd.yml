name: CI/CD - Aplicação

# Build, testes, publicação da imagem no ACR e deploy no AKS.
# Tudo roda nos runners do GitHub; a autenticação no Azure usa OIDC, então
# nenhuma senha ou certificado fica guardado no repositório.
#
# Secrets (já configurados):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  ACR_NAME: postechacr13soat
  IMAGE_NAME: postechallenge-api
  RESOURCE_GROUP: pos-tech-fiap
  CLUSTER_NAME: postech-aks
  NAMESPACE: postechallenge
  APIM_GATEWAY: https://pos-tech-fiap-apim.azure-api.net
  # Clientes do seed (postech-infra-db/sql/schema-azure.sql). O CPF do "Joao da
  # Silva" no seed, 12345678901, tem digito verificador errado e e rejeitado
  # pela Function — serve justamente como o caso negativo.
  CPF_VALIDO: "98765432100"
  CPF_INVALIDO: "12345678901"
  # Maria Oliveira e o cliente 3 no seed; Carlos Mendes e o gerente.
  # Os CPFs do seed sao validos: o login recusa documento malformado antes
  # mesmo de consultar o banco.
  CLIENTE_ID: "3"
  CPF_FUNCIONARIO: "11144477735"
  SENHA_FUNCIONARIO: "Senha@123"

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Testes unitários
        run: |
          dotnet test PosTechChallenge.Testes/PosTechChallenge.Testes.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --collect:"XPlat Code Coverage"

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  deploy:
    name: Imagem & Deploy no AKS
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login no ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build e push da imagem
        run: |
          set -euo pipefail
          REGISTRY="${{ env.ACR_NAME }}.azurecr.io"
          TAG="${{ github.sha }}"

          docker build \
            -t "$REGISTRY/${{ env.IMAGE_NAME }}:$TAG" \
            -t "$REGISTRY/${{ env.IMAGE_NAME }}:latest" \
            -f Dockerfile .

          docker push "$REGISTRY/${{ env.IMAGE_NAME }}:$TAG"
          docker push "$REGISTRY/${{ env.IMAGE_NAME }}:latest"

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Credenciais do AKS
        run: |
          az aks get-credentials \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Setup kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.3
          sudo mv kustomize /usr/local/bin/
          kustomize version

      # Namespace, Secret e Service são criados pelo Terraform do repositório
      # postech-infra-k8s — o Service precisa existir antes, porque o APIM usa
      # o IP dele como backend. Aqui aplicamos ConfigMap, Deployment e HPA.
      - name: Deploy
        run: |
          set -euo pipefail
          cd k8s/azure
          kustomize edit set image \
            "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          kustomize build . | kubectl apply -f -

      - name: Aguardar o rollout
        run: |
          kubectl rollout status deployment/postechallenge-api \
            --namespace "${{ env.NAMESPACE }}" \
            --timeout=300s

      - name: Estado do cluster
        run: kubectl get pods,svc,hpa --namespace "${{ env.NAMESPACE }}"

      # Prova duas coisas: a aplicação responde, e o gateway protege as rotas.
      - name: Smoke test
        run: |
          set -euo pipefail

          IP=$(kubectl get svc postechallenge-api -n "${{ env.NAMESPACE }}" \
                 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "LoadBalancer: $IP"

          echo "--- /health direto no cluster ---"
          for tentativa in $(seq 1 12); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "http://$IP/health" || true)
            echo "Tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && break
            if [ "$tentativa" = "12" ]; then
              echo "::error::/health nunca respondeu 200"
              exit 1
            fi
            sleep 10
          done

          echo "--- Swagger e documento OpenAPI no cluster (espera-se 200) ---"
          # Mesma tolerancia do /health: o smoke test roda logo apos o rollout e
          # o LoadBalancer ainda pode estar trocando os endpoints. Sem retry, a
          # requisicao pega a janela de troca e volta HTTP 000 — falha de conexao,
          # que nao e o mesmo que rota ausente.
          for rota in /swagger/index.html /openapi/v1.json; do
            for tentativa in $(seq 1 10); do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
                        "http://$IP$rota" || true)
              echo "$rota tentativa $tentativa: HTTP $codigo"
              [ "$codigo" = "200" ] && break
              sleep 6
            done
            if [ "$codigo" != "200" ]; then
              echo "::error::$rota deveria responder 200 com Swagger__Enabled=true, ultimo codigo: $codigo"
              exit 1
            fi
          done

          echo "--- rota protegida via APIM, sem token (espera-se 401) ---"
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
                    "${{ env.APIM_GATEWAY }}/api/v1/clientes" || true)
          echo "HTTP $codigo"
          if [ "$codigo" != "401" ]; then
            echo "::error::Esperado 401 do APIM sem token, recebido $codigo"
            exit 1
          fi
          echo "Gateway protegendo as rotas corretamente."

          echo "--- autenticacao por CPF na Auth Function, via APIM ---"
          # O Container App roda com min_replicas = 0, entao a primeira chamada
          # paga a partida a frio do host de Functions. Tentamos algumas vezes
          # antes de considerar falha — timeout aqui nao e o mesmo que erro.
          for tentativa in $(seq 1 6); do
            # O codigo HTTP e capturado junto do corpo: sem ele, uma falha aqui
            # nao diz se o problema foi rota, backend ou o gateway.
            bruto=$(curl -s -w $'\n%{http_code}' --max-time 60 \
                      -X POST "${{ env.APIM_GATEWAY }}/auth" \
                      -H "Content-Type: application/json" \
                      -d "{\"cpf\":\"$CPF_VALIDO\"}" || true)
            codigo=$(echo "$bruto" | tail -1)
            resposta=$(echo "$bruto" | sed '$d')
            echo "Tentativa $tentativa: HTTP ${codigo:-sem resposta} | corpo: ${resposta:-vazio}"

            # O contrato da Function devolve access_token (AuthResponse), nao
            # "token". jq le o campo pelo nome em vez de raspar a string.
            token=$(echo "$resposta" | jq -r '.access_token // empty' 2>/dev/null || true)
            [ -n "$token" ] && break
            sleep 15
          done

          if [ -z "$token" ]; then
            echo "::error::A Auth Function nao devolveu token para um CPF valido (ultimo HTTP: ${codigo:-sem resposta})."
            exit 1
          fi
          echo "Token emitido pela Function (${#token} caracteres)."

          echo "--- CPF invalido (espera-se 400) ---"
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
                    -X POST "${{ env.APIM_GATEWAY }}/auth" \
                    -H "Content-Type: application/json" \
                    -d "{\"cpf\":\"$CPF_INVALIDO\"}" || true)
          echo "HTTP $codigo"
          if [ "$codigo" != "400" ]; then
            echo "::error::Esperado 400 para CPF com digito verificador invalido, recebido $codigo"
            exit 1
          fi

          echo "--- escopo do token de cliente: rota da operacao (espera-se 403) ---"
          # O gateway aceita o token (senao seria 401); quem recusa e a API, por
          # ser um token de cliente numa rota de equipe. 403 e nao 401 e
          # justamente a prova de que as duas camadas fazem coisas diferentes:
          # o gateway autentica, a aplicacao autoriza.
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                    "${{ env.APIM_GATEWAY }}/api/v1/clientes" \
                    -H "Authorization: Bearer $token" || true)
          echo "HTTP $codigo"
          if [ "$codigo" != "403" ]; then
            echo "::error::Token de cliente deveria receber 403 na listagem de clientes, recebeu $codigo"
            exit 1
          fi

          echo "--- escopo do token de cliente: as proprias ordens (nao pode ser 403) ---"
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                    "${{ env.APIM_GATEWAY }}/api/v1/ordens-servico/cliente/$CLIENTE_ID" \
                    -H "Authorization: Bearer $token" || true)
          echo "HTTP $codigo"
          if [ "$codigo" = "403" ]; then
            echo "::error::O cliente foi barrado nas proprias ordens de servico."
            exit 1
          fi

          echo "--- login de funcionario ---"
          # Codigo e corpo registrados: sem eles, "nao devolveu token" nao
          # distingue CPF recusado na validacao (400) de senha errada (401).
          bruto=$(curl -s -w $'\n%{http_code}' --max-time 30 -X POST \
                   "${{ env.APIM_GATEWAY }}/api/v1/Autenticacao/login" \
                   -H "Content-Type: application/json" \
                   -d "{\"cpf\":\"$CPF_FUNCIONARIO\",\"senha\":\"$SENHA_FUNCIONARIO\"}" || true)
          codigo=$(echo "$bruto" | tail -1)
          corpo=$(echo "$bruto" | sed '$d')
          echo "HTTP ${codigo:-sem resposta} | corpo: ${corpo:-vazio}"

          tokf=$(echo "$corpo" | jq -r '.accessToken // empty' 2>/dev/null || true)
          if [ -z "$tokf" ]; then
            echo "::error::O login de funcionario nao devolveu token (HTTP ${codigo:-sem resposta})."
            exit 1
          fi
          echo "Token de funcionario emitido (${#tokf} caracteres)."

          echo "--- mesma rota, agora com token de equipe (espera-se 200) ---"
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                    "${{ env.APIM_GATEWAY }}/api/v1/clientes" \
                    -H "Authorization: Bearer $tokf" || true)
          echo "HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::Token de equipe deveria receber 200 na listagem de clientes, recebeu $codigo"
            exit 1
          fi

          echo "Fluxo completo validado: CPF -> JWT -> rota protegida, com escopo por perfil."
