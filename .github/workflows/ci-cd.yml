name: CI/CD - Aplicação

# Build, testes, publicação da imagem no ACR e deploy no AKS.
# Tudo roda nos runners do GitHub; a autenticação no Azure usa OIDC, então
# nenhuma senha ou certificado fica guardado no repositório.
#
# Secrets (já configurados):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  ACR_NAME: postechacr13soat
  IMAGE_NAME: postechallenge-api
  RESOURCE_GROUP: pos-tech-fiap
  CLUSTER_NAME: postech-aks
  NAMESPACE: postechallenge
  APIM_GATEWAY: https://pos-tech-fiap-apim.azure-api.net

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Testes unitários
        run: |
          dotnet test PosTechChallenge.Testes/PosTechChallenge.Testes.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --collect:"XPlat Code Coverage"

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  deploy:
    name: Imagem & Deploy no AKS
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login no ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build e push da imagem
        run: |
          set -euo pipefail
          REGISTRY="${{ env.ACR_NAME }}.azurecr.io"
          TAG="${{ github.sha }}"

          docker build \
            -t "$REGISTRY/${{ env.IMAGE_NAME }}:$TAG" \
            -t "$REGISTRY/${{ env.IMAGE_NAME }}:latest" \
            -f Dockerfile .

          docker push "$REGISTRY/${{ env.IMAGE_NAME }}:$TAG"
          docker push "$REGISTRY/${{ env.IMAGE_NAME }}:latest"

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Credenciais do AKS
        run: |
          az aks get-credentials \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Setup kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.3
          sudo mv kustomize /usr/local/bin/
          kustomize version

      # Namespace, Secret e Service são criados pelo Terraform do repositório
      # postech-infra-k8s — o Service precisa existir antes, porque o APIM usa
      # o IP dele como backend. Aqui aplicamos ConfigMap, Deployment e HPA.
      - name: Deploy
        run: |
          set -euo pipefail
          cd k8s/azure
          kustomize edit set image \
            "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          kustomize build . | kubectl apply -f -

      - name: Aguardar o rollout
        run: |
          kubectl rollout status deployment/postechallenge-api \
            --namespace "${{ env.NAMESPACE }}" \
            --timeout=300s

      - name: Estado do cluster
        run: kubectl get pods,svc,hpa --namespace "${{ env.NAMESPACE }}"

      # Prova duas coisas: a aplicação responde, e o gateway protege as rotas.
      - name: Smoke test
        run: |
          set -euo pipefail

          IP=$(kubectl get svc postechallenge-api -n "${{ env.NAMESPACE }}" \
                 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "LoadBalancer: $IP"

          echo "--- /health direto no cluster ---"
          for tentativa in $(seq 1 12); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "http://$IP/health" || true)
            echo "Tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && break
            if [ "$tentativa" = "12" ]; then
              echo "::error::/health nunca respondeu 200"
              exit 1
            fi
            sleep 10
          done

          echo "--- rota protegida via APIM, sem token (espera-se 401) ---"
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
                    "${{ env.APIM_GATEWAY }}/api/v1/clientes" || true)
          echo "HTTP $codigo"
          if [ "$codigo" != "401" ]; then
            echo "::error::Esperado 401 do APIM sem token, recebido $codigo"
            exit 1
          fi
          echo "Gateway protegendo as rotas corretamente."
