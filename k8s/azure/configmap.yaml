apiVersion: v1
kind: ConfigMap
metadata:
  name: postechallenge-config
  namespace: postechallenge
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"

  # O TLS termina no APIM; entre o gateway e o cluster o tráfego é HTTP.
  # Redirecionar aqui quebraria as chamadas vindas do LoadBalancer.
  HttpsRedirection__Enabled: "false"

  # Usado pelo documento OpenAPI para apontar o servidor correto.
  OpenApi__ServerUrl: "https://pos-tech-fiap-apim.azure-api.net"

  # Liga o Swagger fora de Development. A documentação fica navegável no
  # ambiente publicado, o que a entrega da Fase 3 precisa para a demonstração.
  #
  # Consequência assumida: /swagger e /openapi/v1.json ficam anônimos no
  # LoadBalancer do cluster, expondo o contrato da API (não os dados — as rotas
  # seguem exigindo JWT). Desligar é trocar esta chave para "false".
  Swagger__Enabled: "true"
