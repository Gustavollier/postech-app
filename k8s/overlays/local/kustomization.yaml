apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay LOCAL — para uso com kind na máquina do desenvolvedor
# Uso: kubectl apply -k k8s/overlays/local/

bases:
  - ../../base

# Kustomize substitui a imagem sem precisar editar nenhum arquivo
images:
  - name: postechallenge-api
    newName: postechallenge-api
    newTag: local

# Patch para garantir imagePullPolicy: Never
# (imagem carregada via `kind load docker-image`, não precisa de registry)
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postechallenge-api
        namespace: postechallenge
      spec:
        template:
          spec:
            containers:
              - name: postechallenge-api
                imagePullPolicy: Never
