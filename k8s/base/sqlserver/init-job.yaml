apiVersion: batch/v1
kind: Job
metadata:
  name: sqlserver-init
  namespace: postechallenge
  labels:
    app: sqlserver-init
spec:
  completions: 1
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: sqlserver-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Aguardando SQL Server ficar disponivel..."
              until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" > /dev/null 2>&1; do
                echo "SQL Server ainda nao esta pronto, aguardando 5s..."
                sleep 5
              done
              echo "SQL Server disponivel!"
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postechallenge-secrets
                  key: MSSQL_SA_PASSWORD
      containers:
        - name: sql-init
          image: mcr.microsoft.com/mssql/server:2022-latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Executando script de inicializacao do banco..."
              /opt/mssql-tools18/bin/sqlcmd \
                -S sqlserver \
                -U sa \
                -P "$MSSQL_SA_PASSWORD" \
                -No \
                -v APP_DB_PASSWORD="$APP_DB_PASSWORD" \
                -i /usr/config/init.sql
              echo "Inicializacao concluida com sucesso!"
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postechallenge-secrets
                  key: MSSQL_SA_PASSWORD
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postechallenge-secrets
                  key: APP_DB_PASSWORD
          volumeMounts:
            - name: sql-init-script
              mountPath: /usr/config
      volumes:
        - name: sql-init-script
          configMap:
            name: sql-init-script
